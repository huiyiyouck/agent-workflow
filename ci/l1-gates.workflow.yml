# BCR-015 L1 门禁（下游仓 workflow 模板，经 sync-downstream.sh --enable-l1-gates 分发为 .github/workflows/l1-gates.yml）
# 降级条款判据以本 workflow 在当前 commit 的绿灯结论为准：绿 → 阶段自动推进；非绿（红/未跑/进行中/查不到/不存在）→ 维持 Owner 确认（fail-closed）。
name: l1-gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: G1/G2/G4/G5 · 状态一致性 / 验收证据链 / Review 完整性 / 打回闸
        run: sh scripts/gates/l1-gates.sh .
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: 20
      - name: G3 · 验收脚本执行（项目自身测试命令）
        run: |
          # 约定：优先 `test:ci`（CI 内自足的用例集，排除依赖兄弟仓/外部环境的集成用例）；无则跑 `test`。
          # 无任何测试入口时显式失败（fail-closed，R3-M4）：无测试的仓不该绿——未就绪就不应启用 l1-gates。
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
            if grep -q '"test:ci"' package.json; then npm run test:ci
            elif grep -q '"test"' package.json; then npm test
            else
              echo "::error::G3 失败：package.json 无 test / test:ci 脚本——L1 门禁要求可执行测试。该怎么改：补最小测试基建后重跑；未就绪的仓不应启用 l1-gates（降级条款下维持 Owner 确认）"; exit 1
            fi
          else
            echo "::error::G3 失败：仓内无 package.json（非 Node 仓）——本模板 v1 仅内置 Node 测试入口。该怎么改：该仓进入试点前先为模板扩对应语言分支（如 pytest），或暂不启用 l1-gates（降级条款下维持 Owner 确认）"; exit 1
          fi
